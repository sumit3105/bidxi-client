<div class="hero-container">
  <div class="hero-content">
    <div class="hero-text">
      <h1>BidXI</h1>
      <p class="tagline">"Bid Smart. Build Legends. Win Big."</p>
      <p class="description">
        Experience the most authentic, real-time multiplayer fantasy IPL auction game. Join a private lobby, assemble your dream squad, and compete in live bidding wars.
      </p>
      
      <div class="cta-group">

    <div class="hero-visual">
